syntax = "proto3";

package maany.blockrewards.v1;

import "gogoproto/gogo.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "github.com/maany-xyz/maany-provider/x/blockrewards/types";

// Msg defines the Msg service for the blockrewards module.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams updates the module parameters. Authority must be gov module addr.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

// MsgUpdateParams updates the blockrewards module parameters.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  // authority is the expected gov module account (e.g. cosmos1... or maany1... derived from gov module address)
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // reward_amount is the base reward per block, before halving is applied.
  cosmos.base.v1beta1.Coin reward_amount = 2 [(gogoproto.nullable) = false];

  // halving_interval is the number of blocks between halvings; 0 disables halving.
  uint64 halving_interval = 3;
}

message MsgUpdateParamsResponse {}

