syntax = "proto3";

package maany.mintburn.v1;

option go_package = "github.com/maany-xyz/maany-provider/x/mintburn/types";

// Params defines the mintburn module parameters.
message Params {
  // Full consumer chain-ids that are mintburn-enabled. Mintburn will only
  // intercept for consumers that are both CCV-registered and listed here.
  repeated string allowed_consumers = 1;

  // If true, unauthorized transfer channel handshakes are rejected (handshake errors).
  bool reject_unauthorized_channels = 2;

  // Optional ops backdoor: explicitly allow these local client IDs (provider side)
  // to pass authorization, in addition to the Provider registry.
  repeated string allowed_client_ids = 3;

  // Optional ops backdoor: explicitly allow these local connection IDs to pass
  // authorization, in addition to the Provider registry.
  repeated string allowed_connection_ids = 4;

  // Addresses allowed to initiate escrow funding on the provider. If empty,
  // no one is allowed to call escrow-initial (strict by default).
  repeated string allowed_funders = 5;

  // If true, only a single transfer channel per consumer is allow-listed for mintburn.
  // A second authorized channel will be rejected at handshake. When false, additional
  // channels may open but only the canonical channel is intercepted by mintburn.
  bool enforce_single_channel = 6;
}
